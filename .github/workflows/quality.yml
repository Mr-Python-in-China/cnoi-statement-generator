name: Quality Check

on:
  push:
  pull_request:

jobs:
  checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        run: |
          corepack enable
          corepack pnpm -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci

      - name: Run check
        run: pnpm run quality
